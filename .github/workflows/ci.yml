name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # This project intentionally does not commit uv.lock; resolve the tested
      # Python matrix from the package metadata on each run.
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python scripts/check_release.py
